# 鋼鐵供應鏈 - 重要性評分規則

# 基礎分數為 0.5，加上各規則分數，上限 1.0
rules:
- name: 多公司提及
  condition: entities.companies.length > 1
  score: 0.2
  description: 新聞同時提及多家公司，通常代表產業事件
- name: 涉及鋼品價格
  condition: '''steel_price'' in topics'
  score: 0.3
  description: 鋼品價格是鋼鐵產業最核心的指標
- name: 涉及鐵礦砂價格
  condition: '''iron_ore_price'' in topics'
  score: 0.25
  description: 鐵礦砂價格直接影響鋼鐵成本
- name: 涉及財報
  condition: '''earnings'' in topics'
  score: 0.25
  description: 財報是重要的資訊揭露
- name: 情緒極端
  condition: abs(sentiment.score) > 0.7
  score: 0.15
  description: 極端情緒通常代表重大事件
- name: 供應鏈上下游同時提及
  condition: has_upstream_downstream_mention
  score: 0.2
  description: 供應鏈連動通常是重要訊號
- name: 涉及產能利用率
  condition: '''capacity_utilization'' in topics'
  score: 0.2
  description: 產能利用率影響供需平衡與鋼價走勢
- name: 涉及貿易政策
  condition: '''trade_policy'' in topics'
  score: 0.3
  description: 關稅與反傾銷政策直接影響鋼鐵貿易格局
- name: 涉及焦煤與廢鋼
  condition: '''coking_coal_scrap'' in topics'
  score: 0.15
  description: 原料成本變動影響鋼廠毛利
